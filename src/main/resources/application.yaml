spring:
  application:
    name: notification

  # mesmo PostgreSQL do account, mas schema próprio: o consumidor guarda a sua
  # memória de idempotência (processed_events) sem tocar nas tabelas do account
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}?currentSchema=notification
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    schemas: notification

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification
      auto-offset-reset: earliest
    listener:
      ack-mode: record        # confirma (commit do offset) mensagem a mensagem
      concurrency: ${NOTIFY_CONCURRENCY:3}

  # Mailpit no compose/k8s (SMTP falso, sem senha)
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}

store:
  notification:
    topic: account-events
    email-latency: ${EMAIL_LATENCY:50ms}
    idempotent: ${NOTIFY_IDEMPOTENT:true}
    from: boas-vindas@store.local

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true        # /actuator/health/liveness e /readiness
