# CI/CD do notification-service: usa o pipeline reutilizável do repositório platform
# (build + testes, Trivy, imagem multi-arch no GHCR/ECR e deploy no EKS).
# Detalhes: https://pna26.github.io/platform/devops/ci-cd/
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write   # OIDC: o service.yaml assume a role da AWS (ECR e deploy no EKS)

jobs:
  pipeline:
    uses: pna26/platform/.github/workflows/service.yaml@main
    with:
      service: notification
      image: notification-service
      aws-region: ${{ vars.AWS_REGION }}
      eks-cluster: ${{ vars.EKS_CLUSTER }}
      k8s-namespace: ${{ vars.K8S_NAMESPACE || 'store' }}
    secrets: inherit
